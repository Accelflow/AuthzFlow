name: Verify npm OIDC dist-tag permissions
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Must remain false for this bounded verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-oidc-dist-tag-verification
  cancel-in-progress: false
jobs:
  verify-dist-tags:
    if: github.repository == 'Accelflow/AuthzFlow' && github.ref == 'refs/tags/v0.1.0-beta.1-oidc-verification.1' && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/oidc-only.npmrc
      NODE_AUTH_TOKEN: ''
      NPM_TOKEN: ''
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Use a clean npm config and pinned OIDC-capable npm
        shell: bash
        run: |
          set -euo pipefail
          test -z "$NODE_AUTH_TOKEN" && test -z "$NPM_TOKEN"
          : > "$NPM_CONFIG_USERCONFIG"
          npm install --global npm@11.21.1
      - name: Verify existing releases before touching latest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const expected = {
            '@authzflow/core': 'sha512-RdZhhExTxwbH0oKAEk2yvs2reqVt0E+Y4CWu9WZTldoCrZPcxSBzhufmLJwkkSWnsFtREcmU0bKJG105yEZRIw==',
            '@authzflow/server': 'sha512-3N+nZCWoTLauwME8ndXA2Nd6efgM76M4F3M18fGAvKU7pFMSDeCLwrIGN4kNxXjKgcOkd2XOXCdDGVk4Bx6LzA=='
          };
          for (const [name, integrity] of Object.entries(expected)) {
            const response = await fetch('https://registry.npmjs.org/' + name.replace('/', '%2f'));
            assert.equal(response.status, 200);
            const data = await response.json();
            assert.equal(data.versions['0.1.0-beta.1'].dist.integrity, integrity);
            assert.equal(data['dist-tags'].latest, '0.1.0-beta.1');
            assert.equal(data['dist-tags'].beta, '0.1.0-beta.1');
            assert.equal(data['dist-tags'].alpha, '0.1.0-alpha.8');
            console.log('PASS exact existing artifact and tags:', name);
          }
          NODE
      - name: Exercise the two existing publishers with OIDC only
        shell: bash
        run: |
          set -euo pipefail
          result=0
          npm dist-tag add @authzflow/core@0.1.0-beta.1 latest || result=1
          npm dist-tag add @authzflow/server@0.1.0-beta.1 latest || result=1
          exit "$result"
      - name: Read back latest and preserve alpha and beta
        shell: bash
        run: |
          set -euo pipefail
          for package in @authzflow/core @authzflow/server; do
            npm view "$package" dist-tags --json > "$RUNNER_TEMP/tags.json"
            node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const tags=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/tags.json"));assert.equal(tags.latest,"0.1.0-beta.1");assert.equal(tags.beta,"0.1.0-beta.1");assert.equal(tags.alpha,"0.1.0-alpha.8");console.log("PASS OIDC latest update and tag readback",tags);'
          done
